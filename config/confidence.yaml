# Decision weights and thresholds (spec 9.2-9.3). Tune on the dev set only.

# Weight of each independent source that supports a value.
source_weights:
  barcode: 1.0
  ocr: 0.6
  vlm_full: 0.7
  vlm_crop: 0.7        # crop read by a third model (D-005), its own source
  vlm_crop_check: 0.7  # the same crop, another provider (D-012)
  vlm_escalated: 0.7   # a different model
  human: 2.0

# Readers that count as the same source (two reads of one model are not two
# sources, spec 7.1). Agreement needs two different groups.
source_groups:
  barcode: barcode
  ocr: ocr
  vlm_full: vlm
  vlm_crop: vlm_crop   # a different model from the full read (D-005)
  vlm_crop_check: vlm_crop_check
  vlm_escalated: vlm_escalated
  human: human

# Fields whose own check digit proves the digits were read right (D-007): one
# clear source is enough for green, unless something blocks it (illegible,
# decoy label, a rival value). Measured on dev: +8 green, 0 wrong.
self_verifying: [id_number]

# Fields whose value means nothing without its label next to it (D-008): an
# unlabeled commitment number is often another number on the form (order,
# case), so it goes to review instead of yellow.
label_required: [commitment_numbers]

# Vision OCR (D-009) confirms a value only as a clear read at this word
# confidence or above; below it, it still adds a source but not legibility.
ocr_min_conf: 0.8

# Fields whose handwriting is Hebrew cursive, which models misread as Latin
# letters ("Ireei" for ישראלי): a handwritten value in Latin letters goes to
# review instead of competing as a reading (D-012). Printed Latin is fine.
hebrew_handwriting: [first_name, last_name]

# Fields where a value that passes every rule of its own (format, check
# digit, its label next to it, no decoy, dates that fit) is green even from
# one reader, and even when the models put it in different fields (D-016).
# Not names: no rule can tell a misread name.
rules_suffice: [central_numbers, commitment_numbers, receipt_date, sender]

# Fields whose own check (the ID check digit) outweighs the reader's "not
# sure", when the value is where it belongs: read next to the name (the
# patient-area crop) or by its label (D-024). Tamar: an ID is 9 digits, by
# the name or "ת.ז.".
check_overrides_doubt: [id_number]

# Where the lab puts the receipt date (D-023): the "התקבל" stamp, or by hand
# next to the central number. A valid date the reader found there (its label
# or its evidence says so) is the receipt date: written even when the reader
# was unsure, and orange until confirmed. Matched ignoring spaces/punctuation.
receipt_places: ["התקבל", "חותמת", "stamp", "ליד מרכזי"]

anchor_bonus: 0.3      # the right label next to the value
illegible_penalty: 0.5 # the reader itself said it can't read it
decoy_penalty: 1.0     # next to a decoy label (spec 3.4)
# Two values for a single-valued field closer than this -> multiple_candidates.
competitor_margin: 0.5

# Labels that anchor a field (substring match, spaces/punctuation ignored).
anchors:
  central_numbers: ["מרכזי"]
  receipt_date: ["התקבל"]
  id_number: ["ת.ז", "תז", "מ.ז", "מספר זהות", "ID"]

# Labels that make a number a decoy, per field.
decoys:
  id_number: ["מ.ז. אם", "מז אם", "מ.א", "מקרה", "ביקור", "רשומה", "תיק", "טל"]
  central_numbers: ["מקרה", "ביקור", "BIOHAZARD"]
  commitment_numbers: ["מקרה", "ביקור", "BIOHAZARD", "מרכזי"]
  receipt_date: ["ת.קבלה", "לידה", "הדפסה"]
  # Other people's names on the same sticker/form.
  first_name: ["אב", "שם האב", "אם", "שם האם", "רופא", "ד\"ר", "מפעיל"]
  last_name: ["אב", "שם האב", "אם", "שם האם", "רופא", "ד\"ר", "מפעיל"]

dates:
  # A receipt date may be at most this many days before the reference date
  # (the batch export date, not today: spec 3.3).
  max_age_days: 120
  # Receipt is normally 0..N days after the form/sample date.
  max_days_after_form: 10
