# Closed, hierarchical sender list (spec 3.5, 10.2). `sender` gets the most
# specific institution; `sender_parent` is derived from `parent`.
# The kupot and the hospitals of Israel, as the challenge's public list names
# them (Wikipedia, "רשימת בתי החולים בישראל"; the Ministry of Health list).
# `name` is what the export writes; earlier short names stay as aliases, so
# stored data and the ground truth keep matching. A sender seen on the sample
# forms that isn't a kupa or a hospital (IDF, labs) is kept at the end.

# --- kupot ---
- id: clalit
  name: כללית
  type: kupa
  aliases: ["כללית", "שירותי בריאות כללית", "קופ\"ח כללית", "Clalit"]
- id: maccabi
  name: מכבי
  type: kupa
  aliases: ["מכבי", "מכבי שירותי בריאות", "Maccabi"]
