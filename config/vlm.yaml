# Vision model settings (spec 8). Model names live here, not in code.

# Gemini first, Claude only for what is still unresolved (D-006). The API is
# picked by model name: gemini-* -> GEMINI_API_KEY, else ANTHROPIC_API_KEY.
# Full-page read: fast and cheap.
# Planned: gemini-3.8-flash / gemini-3.1-pro-preview, once the key is on a
# paid tier (the free tier allows 20 calls/day and may train on the data).
model: claude-haiku-5-5
# Escalation, only for fields still orange after the decision (spec 8.2).
escalation_model: claude-sonnet-5-5
# Thinking depth for Claude: low | medium | high (Gemini uses its default).
effort: medium
max_tokens: 16000

prompt: page_extract.v2

# Crop reads (spec 8.2.2): a full-resolution crop of the patient area, for
# names and ID that are still unverified after escalation. A third, stronger
# model: on the dev set it reads Hebrew cursive names the others can't (D-005).
crop_model: claude-opus-5-5
# v2 (letter by letter, plus where the name is) is ready but measured no
# better than v1 on dev (D-012): 10/18 first names both, 6/18 vs 8/18 last.
crop_prompt: crop_patient.v1
crop_max_side: 1568
# Re-read a tight, enlarged crop of the name line the first crop read found.
# Needs crop_patient.v2 (v1 reports no box). Off with v1 (D-012).
crop_zoom: false
# The same tight crop through another provider, an independent source
# (vlm_crop_check): when both read the same name, it can turn green.
# Off until the Gemini key is on a paid tier (D-006): e.g. gemini-3.1-pro-preview
crop_check_model: ""

# Privacy (spec 8.4): send a downscaled page, no metadata.
max_side: 1800
jpeg_quality: 90

# Per call: seconds and SDK retries (429/5xx/connection, with backoff).
timeout: 90
max_retries: 3
# Calls in flight at once.
concurrency: 8

# Default labels for the commitment number (spec 3.2); a profile can add more.
commitment_aliases:
  - התחייבות
  - מספר התחייבות
  - דרישה
  - דגימה
  - אסמכתא תקציבית
  - "מס' מעבדה"
