name: vera

# Hackathon setup: deliberately minimal (spec 13.1, DECISIONS D-002).
# SQLite + in-process job queue live inside the api container; nothing else
# to start, so nothing else can fail on demo night. `web` serves the built
# frontend and proxies /api to `api`.

services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NETFREE_REFRESH_CERTS: ${NETFREE_REFRESH_CERTS:-0}
        NPM_STRICT_SSL: ${NPM_STRICT_SSL:-true}
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend
      args:
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        NETFREE_REFRESH_CERTS: ${NETFREE_REFRESH_CERTS:-0}
    command: uvicorn vera.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/vera
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      # "import from folder": the scanner folder, as people type its path
      SCAN_FOLDER_HOST: ${SCAN_FOLDER:-./inbox}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./eval:/eval
      - ./config:/config
      - ./prompts:/prompts
      # scanner folder (read-only): set SCAN_FOLDER in .env to the real one
      - ${SCAN_FOLDER:-./inbox}:/inbox:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
